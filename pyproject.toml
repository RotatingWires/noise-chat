[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noisechat"
version = "0.2.1"
description = "A small CLI chat with client-side encryption and a ciphertext-only relay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<51", "keyring>=25,<26"]

[project.scripts]
noisechat = "noisechat.cli:main"

[tool.setuptools.packages.find]
include = ["noisechat*"]
